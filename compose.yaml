services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api/
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - media-data:/app/media:ro
      - static-data:/app/staticfiles:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment: &django-environment
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-200.18.75.25,localhost,127.0.0.1,srv-01.tail881f91.ts.net}"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-false}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}"
      CORS_ALLOW_ALL_ORIGINS: "${CORS_ALLOW_ALL_ORIGINS:-false}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-http://200.18.75.25,http://localhost,http://127.0.0.1,http://srv-01.tail881f91.ts.net}"
      SECURE_SSL_REDIRECT: "${SECURE_SSL_REDIRECT:-false}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      CSRF_COOKIE_SECURE: "${CSRF_COOKIE_SECURE:-false}"
      SECURE_HSTS_SECONDS: "${SECURE_HSTS_SECONDS:-0}"
      SECURE_HSTS_INCLUDE_SUBDOMAINS: "${SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}"
      SECURE_HSTS_PRELOAD: "${SECURE_HSTS_PRELOAD:-false}"
      DJANGO_SUPERUSER_USERNAME: "${DJANGO_SUPERUSER_USERNAME:-admin}"
      DJANGO_SUPERUSER_EMAIL: "${DJANGO_SUPERUSER_EMAIL:-admin@anato360.local}"
      DJANGO_SUPERUSER_PASSWORD: "${DJANGO_SUPERUSER_PASSWORD:?Set DJANGO_SUPERUSER_PASSWORD in .env}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-anato360}"
      MYSQL_USER: "${MYSQL_USER:-anato360}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}"
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MEDIA_ROOT: /app/media
      STATIC_ROOT: /app/staticfiles
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      IMAGE_PROCESSOR_URL: http://image-processor:8001
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: "${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}"
      OLLAMA_LLM_MODEL: "${OLLAMA_LLM_MODEL:-llama3.1}"
      OLLAMA_CHAT_MODEL: "${OLLAMA_CHAT_MODEL:-${OLLAMA_LLM_MODEL:-llama3.1}}"
      OLLAMA_REQUEST_TIMEOUT: "${OLLAMA_REQUEST_TIMEOUT:-300}"
    volumes:
      - media-data:/app/media
      - static-data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["celery", "-A", "backend", "worker", "--loglevel=INFO", "--concurrency=${WORKER_CONCURRENCY:-1}"]
    environment: *django-environment
    volumes:
      - media-data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      image-processor:
        condition: service_healthy
    restart: unless-stopped

  image-processor:
    build:
      context: .
      dockerfile: imageService/Dockerfile
    environment:
      IMAGE_OCR_GPU: "${IMAGE_OCR_GPU:-false}"
      IMAGE_USE_OLLAMA: "${IMAGE_USE_OLLAMA:-false}"
      IMAGE_VALIDATE_ANATOMY: "${IMAGE_VALIDATE_ANATOMY:-true}"
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_VISION_MODEL: "${OLLAMA_VISION_MODEL:-llama3.2-vision:11b}"
      OLLAMA_REQUEST_TIMEOUT: "${OLLAMA_REQUEST_TIMEOUT:-300}"
    volumes:
      - image-model-cache:/root/.cache
      - image-ocr-cache:/root/.EasyOCR
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  db:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-anato360}"
      MYSQL_USER: "${MYSQL_USER:-anato360}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=tcp -h 127.0.0.1 -u\"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-5m}"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  ollama-models:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: "${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}"
      OLLAMA_LLM_MODEL: "${OLLAMA_LLM_MODEL:-llama3.1}"
      OLLAMA_CHAT_MODEL: "${OLLAMA_CHAT_MODEL:-${OLLAMA_LLM_MODEL:-llama3.1}}"
      OLLAMA_VISION_MODEL: "${OLLAMA_VISION_MODEL:-llama3.2-vision:11b}"
      IMAGE_USE_OLLAMA: "${IMAGE_USE_OLLAMA:-false}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -eu;
        ollama pull "$${OLLAMA_CHAT_MODEL}";
        ollama pull "$${OLLAMA_EMBEDDING_MODEL}";
        if [ "$${IMAGE_USE_OLLAMA}" = "true" ] || [ "$${IMAGE_USE_OLLAMA}" = "1" ]; then
          ollama pull "$${OLLAMA_VISION_MODEL}";
        fi
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  mysql-data:
  redis-data:
  media-data:
  static-data:
  image-model-cache:
  image-ocr-cache:
  ollama-data:
