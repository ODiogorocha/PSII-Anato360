# Private Tailscale Serve forwards localhost:8081 to this compute-only gateway.
server {
    listen 80;
    server_name _;
    client_max_body_size 25m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location /image-processor/ {
        set $processor_upstream http://image-processor:8001;
        rewrite ^/image-processor/(.*)$ /$1 break;
        proxy_pass $processor_upstream;
        proxy_connect_timeout 3s;
        proxy_read_timeout 1900s;
        proxy_send_timeout 1900s;
    }

    location /ollama/ {
        set $ollama_upstream http://ollama:11434;
        rewrite ^/ollama/(.*)$ /$1 break;
        proxy_pass $ollama_upstream;
        proxy_connect_timeout 3s;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    location / { return 404; }
}
