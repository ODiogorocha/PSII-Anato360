server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;
    add_header X-Content-Type-Options nosniff always;
    # Refresh Docker DNS when the API container is recreated independently.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    location /admin/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location ^~ /media/user_uploads/ {
        return 404;
    }

    location /media/pecas_360/ {
        alias /app/media/pecas_360/;
    }

    location /media/pecas_3d/ {
        alias /app/media/pecas_3d/;
    }

    location /media/ {
        return 404;
    }

    location ~ /\. {
        return 404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
