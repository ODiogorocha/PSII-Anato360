# Internal server gateway, reached only through the public frontend proxy.
map $http_x_forwarded_proto $forwarded_proto {
    default http;
    https https;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;
    add_header X-Content-Type-Options nosniff always;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location ~ ^/(api|admin)/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    location /static/ { alias /app/staticfiles/; }
    location ^~ /media/user_uploads/ { return 404; }
    location /media/pecas_360/ { alias /app/media/pecas_360/; }
    location /media/pecas_3d/ { alias /app/media/pecas_3d/; }
    location ~ /\. { return 404; }
    location / { return 404; }
}
